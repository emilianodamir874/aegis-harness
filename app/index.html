<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0e">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aegis">
  <title>Aegis · Chat</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sb-head">
        <div class="brand">
          <span class="brand-aegis"><svg class="brand-mark" viewBox="0 0 128 128" width="17" height="17" aria-hidden="true"><circle cx="64" cy="66" r="36" fill="none" stroke="currentColor" stroke-width="13" stroke-dasharray="196 30" stroke-linecap="round" transform="rotate(-110 64 66)"/><circle cx="46" cy="34" r="13" fill="currentColor"/></svg></span>
          <span class="brand-name">Aegis</span>
          <span class="brand-chip">web</span>
          <button id="btn-close-drawer" class="icon-btn sb-close" aria-label="Cerrar menú">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
        </div>
        <button id="btn-new" class="btn-new">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          Nuevo chat
        </button>
        <div class="sb-search">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.4"/><path d="M10.6 10.6 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          <input id="search" type="text" placeholder="Buscar sesiones…" autocomplete="off">
          <span class="kbd-hint">Ctrl K</span>
        </div>
      </div>
      <div id="session-list" class="sb-list"></div>
      <div class="sb-foot">
        <span id="conn-dot" class="dot"></span>
        <span id="conn-text">Conectando…</span>
        <span id="conn-host" class="sb-host"></span>
        <button id="btn-logout" class="sb-logout" type="button" hidden
          title="Cerrar sesión: se borra la cookie y la próxima vez pide la contraseña">Salir</button>
      </div>
    </aside>
    <div id="overlay" class="overlay" hidden></div>

    <main class="main">
      <header class="topbar">
        <button id="btn-menu" class="icon-btn only-mobile" aria-label="Menú">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <div id="chat-title" class="chat-title">Nuevo chat</div>
        <div id="chips" class="chips"></div>
        <button id="btn-goals" class="icon-btn" aria-label="Objetivos (/goal)" title="Objetivos de los chats (/goal y /grind)" aria-pressed="false">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="6.6" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="10" r="2.4" fill="currentColor"/></svg>
        </button>
      </header>

      <div id="messages" class="messages">
        <div id="welcome" class="welcome">
          <div class="welcome-aegis"><svg class="welcome-mark" viewBox="0 0 128 128" width="54" height="54" aria-hidden="true"><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fd8e5"/><stop offset="1" stop-color="#1a7c8a"/></linearGradient></defs><circle cx="64" cy="66" r="36" fill="none" stroke="url(#wg)" stroke-width="13" stroke-dasharray="196 30" stroke-linecap="round" transform="rotate(-110 64 66)"/><circle cx="46" cy="34" r="13" fill="url(#wg)"/><circle cx="41" cy="31" r="2.8" fill="#0d0d0e"/></svg></div>
          <h1 id="welcome-h1">Buenas tardes</h1>
          <p class="welcome-sub">Aegis está listo. Puede leer y editar archivos de esta máquina, correr comandos y buscar en la web.</p>
          <div class="wsug">
            <button class="sug">¿Qué proyectos tengo en el escritorio?</button>
            <button class="sug">Corré los tests y contame cómo salió</button>
            <button class="sug">¿Qué modelos tenés disponibles?</button>
          </div>
        </div>
      </div>

      <footer class="composer-wrap">
        <div id="goalbar" class="goalbar" hidden></div>
        <div id="attachments" class="attachments" hidden></div>
        <div id="slash-menu" class="slash-menu" hidden></div>
        <div class="composer">
          <div id="runbar" class="runbar" role="status" aria-live="polite" hidden>
            <span class="runbar-spin" aria-hidden="true"></span>
            <span id="runbar-text" class="runbar-text">Aegis está trabajando…</span>
            <span id="runbar-time" class="runbar-time"></span>
            <button id="runbar-stop" class="runbar-stop" type="button">Detener</button>
          </div>
          <button id="btn-attach" class="icon-btn attach-btn" aria-label="Adjuntar imagen o archivo" title="Adjuntar imagen o archivo de texto (o arrastralos / pegá una captura)">
            <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M10 4.5v11M4.5 10h11" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          </button>
          <input id="file-input" type="file" accept="image/*,.txt,.md,.markdown,.json,.jsonl,.csv,.tsv,.log,.yml,.yaml,.toml,.ini,.cfg,.conf,.env,.sh,.ps1,.bat,.js,.mjs,.cjs,.ts,.tsx,.jsx,.py,.rs,.go,.rb,.php,.java,.kt,.c,.h,.cpp,.hpp,.cs,.swift,.sql,.html,.htm,.css,.scss,.xml,.svg,.gitignore,.dockerfile" multiple hidden>
          <textarea id="input" rows="1" placeholder="Escribí un mensaje…" enterkeyhint="send" autocomplete="off" autocapitalize="sentences" spellcheck="false" title="Enter envía · Shift+Enter salto de línea · Ctrl+V pega capturas"></textarea>
          <button id="btn-mic" class="icon-btn mic-btn" aria-label="Dictar por voz" title="Dictar por voz (necesita HTTPS · tocá para grabar, tocá de nuevo para transcribir)">
            <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M10 12.5a2.5 2.5 0 0 0 2.5-2.5V5a2.5 2.5 0 0 0-5 0v5A2.5 2.5 0 0 0 10 12.5Z" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 9.5v.5a4.5 4.5 0 0 0 9 0v-.5M10 14.5V17M7.5 17h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <button id="btn-read" class="icon-btn read-btn" aria-label="Leer en voz alta" title="Leer en voz alta: lee SOLO el bloque «Para escuchar» de cada respuesta, en vivo mientras llega">
            <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M4 8v4h2.5L10 15V5L6.5 8H4Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12.8 7.6a3.4 3.4 0 0 1 0 4.8M15 5.7a6.3 6.3 0 0 1 0 8.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          </button>
          <button id="btn-send" class="send" aria-label="Enviar">
            <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M10 16V5M5.5 9.5 10 5l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="btn-stop" class="send stop" aria-label="Detener" hidden>
            <svg width="14" height="14" viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="2" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="composer-meta">
          <span id="meta-left"></span>
          <span id="meta-right"></span>
        </div>
      </footer>
    </main>

    <div id="goals" class="goals-pop" hidden role="dialog" aria-label="Objetivos de este chat">
      <div class="gp-head">
        <span class="gp-title">Objetivos de este chat</span>
        <button id="gp-refresh" class="icon-btn gp-refresh" aria-label="Actualizar objetivos" title="Actualizar">↻</button>
      </div>
      <div id="gp-body" class="gp-body"></div>
    </div>
  </div>

  <div id="dropzone" class="dropzone" hidden>
    <div class="dropzone-box">
      <div class="dropzone-ic">🖼️</div>
      <div class="dropzone-t">Soltá acá</div>
      <div class="dropzone-s">imágenes o archivos de texto para adjuntar como contexto</div>
    </div>
  </div>

  <script src="./config.js"></script>
  <script src="./app.js" defer></script>
  <script src="./skills.js" defer></script>
</body>
</html>
